[package]
name = "saphire-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
bcrypt = "0.19.3"
dotenvy = "0.15.7"
futures-util = "0.3"
getrandom = "0.4.3"
http-body-util = "0.1.5"
multer = "3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync"] }
tokio-rusqlite = { version = "0.8", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }
